```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>M3U8 Player</title>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      font-family: Arial, sans-serif;
    }

    .player {
      width: min(100%, 1000px);
      padding: 20px;
    }

    video {
      width: 100%;
      display: block;
      background: #000;
      border-radius: 8px;
    }

    h1 {
      color: white;
      font-size: 20px;
      margin: 0 0 15px;
    }

    #status {
      color: #aaa;
      margin-top: 10px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="player">
    <h1>M3U8 Player</h1>

    <video id="video" controls playsinline></video>

    <div id="status">Loading stream...</div>
  </div>

  <script>
    const video = document.getElementById("video");
    const status = document.getElementById("status");

    const streamUrl =
      "https://saseries.akamaized.net/hls/live/2110097/D2PAKvsWI-TesT-tapmad/master.m3u8";

    // Chrome, Firefox, Edge, etc.
    if (Hls.isSupported()) {
      const hls = new Hls();

      hls.loadSource(streamUrl);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        status.textContent = "Stream ready";
      });

      hls.on(Hls.Events.ERROR, (event, data) => {
        console.error("HLS error:", data);

        if (data.fatal) {
          status.textContent = "Unable to play stream";
        }
      });

    // Safari / browsers with native HLS support
    } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
      video.src = streamUrl;

      video.addEventListener("loadedmetadata", () => {
        status.textContent = "Stream ready";
      });

    } else {
      status.textContent = "HLS is not supported by this browser.";
    }
  </script>

</body>
</html>
